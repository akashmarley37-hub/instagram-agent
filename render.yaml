services:
  # -------------------------------------------------------------
  # Backend API Service (FastAPI + APScheduler + SQLite/Postgres)
  # -------------------------------------------------------------
  - type: web
    name: instagram-agent-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: instagram-agent-storage
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/instagram_agent.db
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false # Set to your Render backend URL (e.g. https://instagram-agent-api.onrender.com)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SCHEDULER_TIMEZONE
        value: UTC

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite + Tailwind CSS)
  # -------------------------------------------------------------
  - type: web
    name: instagram-agent-dashboard
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: instagram-agent-api
          property: host
